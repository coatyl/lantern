name: Feature request
description: Suggest something Lantern should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Lantern is local-only: features must work offline, and anything that touches the network stays opt-in (see PHILOSOPHY.md). ROADMAP.md lists what is already planned.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do with your bookmarks, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. Mockups and examples welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
