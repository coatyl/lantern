[package]
name         = "lantern-app"
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
description  = "Tauri application shell for Lantern: glue layer between lantern-core/lantern-io and the React UI."

[lib]
# cdylib for Tauri's mobile targets; rlib for `main.rs`.
crate-type = ["cdylib", "rlib"]

# The user-facing executable is `lantern`, not `lantern-app`.
[[bin]]
name = "lantern"
path = "src/main.rs"

# The default build includes the opt-in dead-link checker.  The offline build
# (`--no-default-features`) drops `lantern-net` entirely, so no networking
# crate (reqwest, hyper, rustls) is linked; CI checks this with `cargo tree`.
[features]
default = ["checker"]
checker = ["dep:lantern-net", "lantern-net/checker"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lantern-core = { workspace = true }
lantern-io   = { workspace = true }
lantern-net  = { workspace = true, optional = true }
indexmap     = { workspace = true }
parking_lot  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
toml         = { workspace = true }
thiserror    = { workspace = true }
url          = { workspace = true }
regex        = { workspace = true }
ts-rs        = { workspace = true }
tauri        = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell  = "2"

[dev-dependencies]
tempfile     = { workspace = true }
# Mock runtime for driving commands and the IPC layer in unit tests.
tauri        = { version = "2", features = ["test"] }
